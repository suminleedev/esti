# 데모 배포 프로파일 — 공개용. 실데이터가 한 건도 올라가지 않는다 (계획서 제1 원칙).
# 공통 설정은 application.properties에 있고, 여기에는 local과 갈리는 것만 적는다.

# ===== PostgreSQL (G11, D-7) =====
# 데모 데이터가 재시작·재배포에도 남아야 한다 — 예전 인메모리 Derby는 뜰 때마다 비었다.
# 실 카탈로그 파일 DB(./data/estimateDB)는 Derby라 이 프로파일에서는 열 경로 자체가 없다(제1 원칙).
# 접속 정보는 환경변수로 준다. 기본값은 로컬 확인용(docker run postgres)이고, EC2에서는 compose가
# ESTI_DB_URL에 db 컨테이너 주소를, ESTI_DB_PASSWORD에 SSM 비밀값을 넣는다.
spring.datasource.url=${ESTI_DB_URL:jdbc:postgresql://localhost:5432/esti}
spring.datasource.username=${ESTI_DB_USER:esti}
spring.datasource.password=${ESTI_DB_PASSWORD:}
# 공통 설정의 Derby 드라이버를 덮는다.
spring.datasource.driver-class-name=org.postgresql.Driver
# 엔티티가 쓰는 스키마(APP)를 빈 DB에 만든다. Derby는 스키마를 알아서 만들지만 PostgreSQL은
# 없으면 테이블 생성이 전부 실패한 채로 «기동은 된다»(실측). 이미 있으면 건드리지 않는다.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# 데이터가 남아야 하므로 create/create-drop을 쓰지 않는다. 시드는 DemoSeedRunner가 빈 공급사에만 넣는다.
# (Flyway는 보류 — 데모 스키마 변경 이력이 쌓이면 재검토)
spring.jpa.hibernate.ddl-auto=update

# 데모 로그에 SQL을 쏟지 않는다.
spring.jpa.show-sql=false

# ===== 업로드 자원 상한 (D-5) =====
# 공개 배포본에 남는 위험은 전부 「자원 고갈」이다 — 확장자 위장·경로 순회·XXE는 이미 막혀 있다.
# 100MB짜리 워크북은 POI가 통째로 힙에 올리는데, 데모는 DB까지 같은 힙이라 OOM 하나로 둘 다 증발한다.
# 실파일 한 벌이 1MB가 안 되므로 2MB면 정상 사용은 안 막고 폭탄만 걸린다.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# 한 번에 하나만 처리하고 대기는 1건까지. 연타하면 즉시 거절된다.
# 기본값은 큐가 사실상 무제한이라 대기 파일이 디스크에 쌓인다.
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=1

# ===== CORS (D-6) =====
# 프론트를 같은 jar에 담으면(D-8) same-origin이라 사실상 쓰이지 않는다.
# 그래도 값은 빼 둔다 — 프론트를 따로 호스팅하게 되면 여기만 고치면 된다.
# 환경변수 APP_CORS_ALLOWED_ORIGINS로 덮어쓸 수 있다(배포 도메인이 정해지면 그쪽을 쓴다).
app.cors.allowed-origins=http://localhost:8080
