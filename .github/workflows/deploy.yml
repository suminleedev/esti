# 데모 배포본 이미지를 만들어 ECR 에 올린다. 실사용(local 프로파일)과는 무관하다.
# 설계 근거는 계획서(로컬 docs/) 의 배포 도구 선정 문서 §6·§7 을 본다.

name: 데모 이미지 빌드·푸시

# master 에 올라간 것만 배포한다. 신뢰 정책도 ref:refs/heads/master 로 잠겨 있어서
# 다른 브랜치에서 돌리면 AWS 자격증명 단계에서 거부된다 (저장소가 public 이라 의도한 것이다).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 토큰을 받아 AWS 역할을 맡는 데 필요하다. 액세스 키는 쓰지 않는다.
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: esti-demo

jobs:
  build-and-push:
    # ARM64 러너를 쓴다. x86 러너에서 arm64 이미지를 만들려면 QEMU 에뮬레이션이 붙는데,
    # 여기서는 러너 자체가 arm64 라 그냥 네이티브로 나온다. (public 저장소는 무료)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      # 러너는 «git 에서» 체크아웃한다 — 디스크를 보는 로컬 docker build 와 달리
      # gitignore 된 docs/samples/·data/·uploads/ 는 애초에 존재하지 않는다.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esti-vue/package-lock.json

      # pom 의 frontend 프로파일은 `npm run build` 만 부른다 — 설치는 여기서 한다.
      - name: 프론트 의존성 설치
        working-directory: esti-vue
        run: npm ci

      # CI: 'false' 는 «의도된» 설정이다.
      #
      # 공급사 실샘플(docs/samples/)은 gitignore 라 러너에 없다 — 없어야 맞다.
      # TestSamples 는 샘플이 없으면 로컬은 스킵, CI(CI=true)에서는 fail 로 승격한다.
      # 그 승격은 「CI에서 스킵=거짓 초록」을 막으려는 것인데, 여기서는 전제가 다르다.
      # 실샘플이 공개 러너에 갈 일이 «영원히» 없어서, 승격이 켜져 있으면 CI 는
      # 고칠 방법 없이 영구히 빨간불이 된다. 빨간불을 방치하면 아무도 안 읽게 된다.
      #
      # ⚠️ -Dsample.strict=false 로는 안 된다. Maven CLI 의 -D 는 Maven JVM 에만 붙고
      #    surefire 가 «포크한» 테스트 JVM 에는 전달되지 않는다(실측으로 확인).
      #    환경변수는 포크에 반드시 상속되므로 CI 를 직접 끈다.
      #
      # 실측: 실행 559 · 실패 0 · 스킵 235 → CI 가 실제로 검증하는 것은 324건.
      # 빠지는 235건(실샘플 파싱 회귀)은 로컬 빌드가 계속 담당한다.
      - name: 백엔드 테스트 + 프론트 빌드 + 단일 jar
        env:
          CI: 'false'
        run: ./mvnw -B -Pfrontend clean package

      - name: 실제로 몇 건이 돌았는지 남긴다
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob("target/surefire-reports/TEST-*.xml"):
              r=ET.parse(p).getroot()
              t+=int(r.get("tests",0)); f+=int(r.get("failures",0))
              e+=int(r.get("errors",0)); s+=int(r.get("skipped",0))
          print(f"백엔드 테스트: 실행 {t} · 실패 {f} · 오류 {e} · 스킵 {s}")
          print("")
          print("스킵은 공급사 실샘플이 필요한 테스트다 — 러너에 샘플이 없는 것이 정상이다.")
          PY

      # 빌드 컨텍스트를 jar 하나로 좁힌다. 러너에는 실데이터가 없지만,
      # 로컬과 «같은 명령»으로 같은 이미지가 나오게 하려고 형태를 맞춘다.
      - name: 빌드 컨텍스트 구성
        run: cp target/esti-*.jar deploy/esti.jar

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/esti-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 태그를 커밋 SHA 로 박는다 — latest 만으로는 어느 코드가 떠 있는지 못 알아낸다.
      - name: 이미지 빌드·푸시
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$SHA" \
                       -t "$REGISTRY/$ECR_REPOSITORY:latest" deploy
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "pushed=$SHA" >> "$GITHUB_STEP_SUMMARY"

      # 아키텍처 불일치는 첫 배포 사망 원인 1위이고, 죽는 시점이 «ECS 에서» 라 늦게 안다.
      # 여기서 막는다.
      - name: 올라간 이미지가 arm64 인지 확인
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ARCH=$(docker image inspect "$REGISTRY/$ECR_REPOSITORY:latest" --format '{{.Architecture}}')
          echo "architecture=$ARCH"
          [ "$ARCH" = "arm64" ] || { echo "::error::arm64 가 아니다 ($ARCH) — Fargate/t4g 에서 exec format error 로 즉사한다"; exit 1; }
