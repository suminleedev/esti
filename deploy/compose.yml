# 데모 배포본 — Caddy + 앱 + PostgreSQL (G11). 실사용(local)과는 무관하다.
#
# 같은 파일을 로컬과 EC2가 함께 쓴다. 갈리는 것은 앱 이미지 출처뿐이다.
#   로컬:  ./mvnw -Pfrontend clean package && cp target/esti-*.jar deploy/esti.jar
#          docker compose -f deploy/compose.yml up -d --build        (ESTI_IMAGE 없음 → 로컬 빌드)
#   EC2:   deploy/ec2/deploy.sh 가 ESTI_IMAGE=<ECR>/esti-demo:latest 로 pull 해서 띄운다
#
#   비밀값: deploy/.env 의 ESTI_DB_PASSWORD (gitignore — 파일에 적지 않는다. EC2에서는 SSM에서 만든다)
#   초기화: deploy/demo-reset.sh
#
# 🔑 서비스 이름(app·db)과 볼륨 이름은 demo-reset.sh·ec2/deploy.sh 가 그대로 쓴다. 바꾸면 스크립트도 같이.
#
# 메모리: t4g.small(2GB)에 셋을 올린다. 한도를 안 주면 JVM이 호스트 기준으로 힙을 잡아 DB와 다툰다.

name: esti-demo

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # 지금은 HTTP만이다 — HTTPS·도메인은 G11-6(Cloudflare Origin CA)에서 Caddyfile과 함께 바꾼다
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 64m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: esti
      POSTGRES_USER: esti
      POSTGRES_PASSWORD: ${ESTI_DB_PASSWORD:?deploy/.env 에 ESTI_DB_PASSWORD 를 넣어라}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esti -d esti"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  app:
    image: ${ESTI_IMAGE:-esti-demo:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ESTI_DB_URL: jdbc:postgresql://db:5432/esti
      ESTI_DB_USER: esti
      ESTI_DB_PASSWORD: ${ESTI_DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      # 제품 이미지(플레이스홀더·방문자 업로드)를 컨테이너 교체에도 남긴다
      - uploads:/app/uploads
    # 포트를 밖에 열지 않는다 — Caddy만 거친다
    expose:
      - "8080"
    # Dockerfile 이 MaxRAMPercentage=70 이라 힙은 약 770MB
    mem_limit: 1100m

volumes:
  pgdata:
  uploads:
  caddy_data:
