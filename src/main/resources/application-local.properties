# 실사용 프로파일 — 로컬 단일 사용자. 프로파일을 지정하지 않으면 이것이 뜬다.
# 공통 설정은 application.properties에 있고, 여기에는 demo와 갈리는 것만 적는다.

# ===== derby DB (파일) =====
# 실 카탈로그가 들어 있는 파일 DB. 앱을 켜 둔 채 테스트를 돌리면 Derby 락이 부딪히므로
# 테스트는 클래스마다 인메모리 URL로 덮는다 — TestsDoNotTouchRealDbTest가 그 관례를 지킨다.
spring.datasource.url=jdbc:derby:./data/estimateDB;create=true

# ddl-auto : create-drop / update
spring.jpa.hibernate.ddl-auto=update

# ===== 바인딩 (D-10) =====
# 루프백에만 연다. 지금까지는 0.0.0.0에 떠서 같은 네트워크의 다른 기기가 접근할 수 있었다 —
# CORS는 브라우저만 막지 curl은 못 막는다. 「단일 사용자 로컬 실행」 전제를 말이 아니라 설정으로 못박는다.
server.address=127.0.0.1

# ===== 관리자 API 인증 — 끈다 =====
# 크롤러 실행은 사람이 손으로 돌리는 명령인데, 실사용은 루프백에만 열린 단일 사용자 실행이라
# (server.address=127.0.0.1) 자물쇠가 막는 상대가 자기 자신뿐이다. 기동할 때마다 바뀌는
# 비밀번호를 로그에서 찾아 붙이는 값이 지키는 것보다 크다.
#
# 잠그고 싶으면 이 줄을 true로 두고 ADMIN_PASSWORD를 준다.
# 배포본(demo)은 공통 기본값 그대로 잠긴 채다.
app.admin.auth-enabled=false
