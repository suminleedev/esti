# 데모 배포 프로파일 — 공개용. 실데이터가 한 건도 올라가지 않는다 (계획서 제1 원칙).
# 공통 설정은 application.properties에 있고, 여기에는 local과 갈리는 것만 적는다.

# ===== derby DB (인메모리) =====
# 재시작하면 초기 상태로 돌아간다. 방문자가 데이터를 망쳐도 복구가 자동이고,
# 애초에 실 카탈로그 파일 DB(./data/estimateDB)를 열 경로 자체가 없다.
spring.datasource.url=jdbc:derby:memory:estimateDB;create=true
spring.jpa.hibernate.ddl-auto=create-drop

# 데모 로그에 SQL을 쏟지 않는다.
spring.jpa.show-sql=false

# ===== 업로드 자원 상한 (D-5) =====
# 공개 배포본에 남는 위험은 전부 「자원 고갈」이다 — 확장자 위장·경로 순회·XXE는 이미 막혀 있다.
# 100MB짜리 워크북은 POI가 통째로 힙에 올리는데, 데모는 DB까지 같은 힙이라 OOM 하나로 둘 다 증발한다.
# 실파일 한 벌이 1MB가 안 되므로 2MB면 정상 사용은 안 막고 폭탄만 걸린다.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# 한 번에 하나만 처리하고 대기는 1건까지. 연타하면 즉시 거절된다.
# 기본값은 큐가 사실상 무제한이라 대기 파일이 디스크에 쌓인다.
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=1

# ===== CORS (D-6) =====
# 프론트를 같은 jar에 담으면(D-8) same-origin이라 사실상 쓰이지 않는다.
# 그래도 값은 빼 둔다 — 프론트를 따로 호스팅하게 되면 여기만 고치면 된다.
# 환경변수 APP_CORS_ALLOWED_ORIGINS로 덮어쓸 수 있다(배포 도메인이 정해지면 그쪽을 쓴다).
app.cors.allowed-origins=http://localhost:8080
